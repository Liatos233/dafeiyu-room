server {
    listen 3100;
    server_name _;
    client_max_body_size 64m;

    # 只压文本类；webm/glb/png 已是压缩格式，压了白耗 CPU
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 静态资产直出 + 缓存（绕过 bridge 的 token 鉴权；资产无私密内容）
    # 注意：不设 immutable —— 资产偶尔会原地重导出，靠 nginx ETag 在过期后重验。
    # 若后续给资产 URL 加内容哈希（构建链），可升级为 immutable + 更长缓存。
    location /room/assets/ {
        alias /opt/dafeiyu-room/public/room/assets/;
        expires 1d;
        access_log off;
    }
    location /room/vendor/ {
        alias /opt/dafeiyu-room/public/room/vendor/;
        expires 1d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3101;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
